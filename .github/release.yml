changelog:
  exclude:
    labels: [skip-changelog]
    authors: [dependabot]
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Features
      labels: [feature, enhancement]
    - title: Fixes
      labels: [bug, fix]
    - title: Tool support
      labels: [target, tool]
    - title: Documentation
      labels: [docs, documentation]
    - title: Other
      labels: ["*"]
