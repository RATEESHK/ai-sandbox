[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisb"
version = "1.1.0"
description = "ai-sandbox: project-local, OS-aware sandbox for AI coding agents (Claude Code, Cursor, Gemini CLI, Copilot, Antigravity, Windsurf). Nothing global, every command audited."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Rateesh Koganti" }]
keywords = ["ai-agents", "sandbox", "claude-code", "cursor", "gemini-cli", "github-copilot", "antigravity", "windsurf", "mcp", "agent-skills", "devsecops", "ai-safety"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/RATEESHK/ai-sandbox"
Documentation = "https://github.com/RATEESHK/ai-sandbox#readme"
Changelog = "https://github.com/RATEESHK/ai-sandbox/blob/main/CHANGELOG.md"
Issues = "https://github.com/RATEESHK/ai-sandbox/issues"

[project.scripts]
aisb = "aisb.cli:main"

[tool.setuptools]
packages = ["aisb"]
include-package-data = true

[tool.setuptools.package-data]
aisb = ["profiles/*.json", "runtime_lock.json", "guard.py"]
